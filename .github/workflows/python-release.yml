name: python-release

on:
  push:
    tags:
      - "umapers-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release version and tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release_version.py
          fi

  build-wheel:
    name: build-wheel (${{ matrix.platform }}, py${{ matrix.python_version }})
    needs: validate-version
    runs-on: ${{ matrix.platform == 'linux-x86_64' && 'ubuntu-latest' || matrix.platform == 'windows-x86_64' && 'windows-latest' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux-x86_64", "windows-x86_64", "macos-arm64"]
        python_version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: ${{ matrix.platform == 'linux-x86_64' && format('--manifest-path umap_rs/Cargo.toml --release --locked --compatibility pypi --out umap_rs/dist -i python{0}', matrix.python_version) || '--manifest-path umap_rs/Cargo.toml --release --locked --compatibility pypi --out umap_rs/dist -i python' }}
          maturin-version: v1.14.1
          manylinux: "2014"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform }}-py${{ matrix.python_version }}
          path: umap_rs/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: build-sdist
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --manifest-path umap_rs/Cargo.toml --locked --out umap_rs/dist
          maturin-version: v1.14.1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: umap_rs/dist/*.tar.gz
          if-no-files-found: error

  verify-artifacts:
    name: verify-artifacts
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist

      - name: Check artifact metadata
        run: |
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check dist/*
          python scripts/check_python_dist.py --dist-dir dist --expected-count 16

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-release-dist
          path: dist/*
          if-no-files-found: error

  smoke-wheel:
    name: smoke-wheel (${{ matrix.platform }}, py${{ matrix.python_version }})
    needs: [build-wheel]
    runs-on: ${{ matrix.platform == 'linux-x86_64' && 'ubuntu-latest' || matrix.platform == 'windows-x86_64' && 'windows-latest' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux-x86_64", "windows-x86_64", "macos-arm64"]
        python_version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-${{ matrix.platform }}-py${{ matrix.python_version }}
          path: dist

      - name: Install and smoke test wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          if [[ -z "${wheel_path}" ]]; then
            echo "wheel not found" >&2
            exit 1
          fi

          export EXPECTED_VERSION
          EXPECTED_VERSION="$(basename "${wheel_path}" | sed -E 's/^umapers-([0-9][^-]*)-.*/\1/')"

          python -m venv .venv-wheel-smoke
          venv_python=".venv-wheel-smoke/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            venv_python=".venv-wheel-smoke/Scripts/python.exe"
          fi
          "$venv_python" -m pip install --upgrade pip
          "$venv_python" -m pip install "${wheel_path}"
          "$venv_python" - <<'PY'
          import inspect
          import os

          import numpy as np
          from umapers import Umap, UmapKwargs, __version__, fit_transform

          x = np.random.default_rng(0).normal(size=(32, 6)).astype(np.float32)
          kwargs: UmapKwargs = {"n_neighbors": 10, "n_components": 2, "init": "random"}
          model = Umap(**kwargs)
          emb = model.fit_transform(x)
          transformed = model.transform(x[:4])
          reconstructed = model.inverse_transform(transformed)

          assert __version__ == os.environ["EXPECTED_VERSION"]
          assert emb.shape == (32, 2)
          assert emb.dtype == np.float32
          assert transformed.shape == (4, 2)
          assert reconstructed.shape == (4, 6)
          assert np.isfinite(transformed).all()
          assert np.isfinite(reconstructed).all()
          assert "kwargs" in inspect.signature(fit_transform).parameters
          assert hasattr(model, "fit_transform_with_knn")
          PY

  publish-pypi:
    name: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify-artifacts, smoke-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/umapers

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-dist
          path: dist

      - name: Validate release assets
        run: |
          python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
          python scripts/check_python_dist.py --dist-dir dist --expected-count 16

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          release_title="umapers ${GITHUB_REF_NAME#umapers-v}"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$release_title" \
              --notes-file "$notes_file"
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          asset_count="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets | length')"
          if [[ "$asset_count" != "16" ]]; then
            echo "expected 16 GitHub Release assets, found $asset_count" >&2
            exit 1
          fi
